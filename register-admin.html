<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin registration — WE-LINK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/welink-cinematic-theme.css" />
  <link rel="stylesheet" href="css/welink-cinematic-readability.css" />
  <link rel="stylesheet" href="css/welink-theme.css" />
  <link rel="stylesheet" href="css/welink-responsive.css" />
  <meta name="theme-color" content="#0c2229" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="js/theme-boot.js"></script>
</head>
<body class="welink-cinematic">
  <header data-header></header>
  <main class="page wrap">
    <h1>Register as <span class="gold">admin</span></h1>
    <p class="lede">Create an account here. Admin access is granted manually in Supabase by changing your profile role to <strong>admin</strong>.</p>
    <form class="card" id="admin-form" style="max-width:460px">
      <label>Full name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Password <input type="password" name="password" required minlength="6" /></label>
      <p class="err" id="err" hidden></p>
      <button class="btn btn-primary ix" type="submit">Create account</button>
    </form>
    <p class="muted" style="margin-top:16px">Already have an account? <a class="gold" href="login.html?role=admin">Admin login</a></p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/welink-app.js"></script>
  <script>
    (async () => {
      await WeLink.ready;
      WeLinkUI.renderHeader(document.querySelector("[data-header]"));
      document.getElementById("admin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const btn = f.querySelector("button");
        btn.disabled = true;
        const res = await WeLink.registerAdmin({
          name: f.name.value,
          email: f.email.value,
          password: f.password.value
        });
        const err = document.getElementById("err");
        if (!res.ok) {
          err.hidden = false;
          err.textContent = res.error;
          btn.disabled = false;
          return;
        }
        alert("Account created. Ask the platform owner to set your profile role to admin in Supabase, then sign in below.");
        location.href = "login.html?role=admin";
      });
    })();
  </script>
</body>
</html>
