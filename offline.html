<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — WeLink</title>
  <meta name="theme-color" content="#0c2229" />
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/welink-design-tokens.css" />
  <link rel="stylesheet" href="css/welink-theme.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, sans-serif;
      background: var(--background);
      color: var(--text-primary);
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--text-secondary); margin: 0 0 20px; max-width: 28rem; }
    a {
      display: inline-flex;
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--primary);
      color: var(--on-primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>WeLink needs a connection for accounts, messages, and live data. Cached pages may still open.</p>
    <a href="index.html">Try again</a>
  </main>
</body>
</html>
