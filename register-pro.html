<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional registration — WE-LINK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/welink-cinematic-theme.css" />
  <link rel="stylesheet" href="css/welink-cinematic-readability.css" />
  <link rel="stylesheet" href="css/welink-theme.css" />
  <link rel="stylesheet" href="css/welink-responsive.css" />
  <meta name="theme-color" content="#0c2229" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="js/theme-boot.js"></script>
</head>
<body class="welink-cinematic">
  <header data-header></header>
  <main class="page wrap">
    <h1>Register as a <span class="gold">professional</span></h1>
    <p class="lede">Admin receives your request and can approve or reject it. After approval, your profile goes live.</p>
    <form class="card" id="pro-form" style="max-width:640px">
      <img class="photo-prev" id="prev" alt="" hidden />
      <div class="grid-2">
        <label>Full name <input name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
      </div>
      <label>Password <input type="password" name="password" required minlength="6" /></label>
      <label>Phone / WhatsApp <input name="phone" required placeholder="+237 6XX XXX XXX" /></label>
      <div class="grid-2">
        <label>Primary skill
          <select name="skill" required id="pro-primary-skill">
            <option value="">Select your main skill…</option>
          </select>
        </label>
        <label>Location <input name="location" required placeholder="City" /></label>
      </div>
      <label>Secondary skills
        <textarea name="secondarySkills" placeholder="Other skills you offer (e.g. AI Prompt Engineering, mentoring). Separate with commas or new lines."></textarea>
      </label>
      <label>Bio <textarea name="bio" required placeholder="Tell guests about your work and experience"></textarea></label>
      <label>Achievements <textarea name="achievements" placeholder="Key results, certifications, notable projects (optional)"></textarea></label>
      <label>Profile photo <input type="file" name="photo" accept="image/*" /></label>
      <p class="err" id="err" hidden></p>
      <button class="btn btn-primary ix" type="submit">Send registration request</button>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/welink-app.js"></script>
  <script>
    (async () => {
      await WeLink.ready;
      WeLinkUI.renderHeader(document.querySelector("[data-header]"));
      const sel = document.getElementById("pro-primary-skill");
      WeLink.SKILLS.forEach((s) => {
        const o = document.createElement("option");
        o.value = s;
        o.textContent = s;
        sel.appendChild(o);
      });
      const prev = document.getElementById("prev");
      document.querySelector("[name=photo]").addEventListener("change", async (e) => {
        try {
          const data = await WeLinkHelpers.fileToData(e.target.files[0]);
          if (data) { prev.src = data; prev.hidden = false; }
        } catch (err) { alert(err.message); }
      });
      document.getElementById("pro-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const err = document.getElementById("err");
        err.hidden = true;
        if (!f.skill.value.trim()) {
          err.hidden = false;
          err.textContent = "Select your primary skill.";
          return;
        }
        const btn = f.querySelector("button");
        btn.disabled = true;
        let photo = "";
        try {
          photo = await WeLinkHelpers.fileToData(f.photo.files[0]);
        } catch (photoErr) {
          err.hidden = false;
          err.textContent = photoErr.message;
          btn.disabled = false;
          return;
        }
        const res = await WeLink.registerPro({
          name: f.name.value,
          email: f.email.value,
          password: f.password.value,
          phone: f.phone.value,
          skill: f.skill.value,
          secondarySkills: f.secondarySkills.value,
          location: f.location.value,
          bio: f.bio.value,
          achievements: f.achievements.value,
          photo
        });
        if (!res.ok) {
          err.hidden = false; err.textContent = res.error; btn.disabled = false; return;
        }
        await WeLink.emailAdmin(res.account);
        WeLink.notifyAdminWhatsApp(res.account);
        location.href = "dashboard.html";
      });
    })();
  </script>
</body>
</html>
